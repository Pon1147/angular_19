@for (user of users; track user.id) {
    <p>{{user.id}}.{{user.name}}</p> 
}
<!-- Control Flow in Components - @for -->

<!-- QThông thường khi xây dựng các ứng dụng web, 
 bạn cần lặp lại một số mã một số lần cụ thể - 
 ví dụ: đưa ra một mảng tên, bạn có thể muốn hiển thị 
 từng tên trong thẻ <p>.

Trong hoạt động này, bạn sẽ học cách 
sử dụng @for để lặp lại các yếu tố trong một mẫu. -->
